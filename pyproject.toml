[project]
name = "mantha-remora"
version = "0.1.0.dev0"
description = "Read-only security checker for Linux virtual machines: finds the misconfigurations that make a VM unsafe."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shashank Mantha" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.7",
    "paramiko>=3.5",
]
keywords = ["security", "linux", "hardening", "audit", "virtual-machine", "misconfiguration"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/shashankmantha/mantha-remora"
Issues = "https://github.com/shashankmantha/mantha-remora/issues"

[project.scripts]
remora = "remora.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-paramiko>=3.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear: likely bugs
    "UP",      # modern Python syntax
    "S",       # bandit: security smells
    "SIM",     # simplifications
    "RUF",     # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest works
    "S108",  # tests name fake /tmp paths that are never created
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]